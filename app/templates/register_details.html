<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Complete Profile | Campus Pulse</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0a0a0a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Inter', sans-serif; }
        .form-container { background: #1a1a1a; padding: 2rem; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid #333; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; background: #000; border: 1px solid #444; color: white; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #d90429; color: white; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2 style="margin-bottom: 10px;">One Last Step!</h2>
        <p style="color: #888; margin-bottom: 20px;">Please complete your profile to register for events.</p>
        
        <form action="/complete-profile" method="POST">
            <label>Full Name</label>
            <input type="text" value="{{ user.full_name }}" disabled style="opacity: 0.5;">
            
            <label>Mobile Number</label>
            <input type="text" name="mobile" placeholder="Enter your mobile" required>
            
            <label>Branch / Department</label>
            <input type="text" name="branch" placeholder="e.g. CS, Mechanical" required>
            
            <button type="submit">Save & Continue</button>
        </form>
    </div>
</body>
</html>
