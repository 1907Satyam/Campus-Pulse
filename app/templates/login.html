<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Campus Pulse</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            min-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .auth-card {
            background: var(--dark-grey);
            padding: 2.5rem;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(179, 143, 111, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--sand); font-size: 0.9rem; }
        .form-group input {
            width: 100%;
            padding: 0.8rem;
            background: var(--obsidian);
            border: 1px solid #333;
            color: white;
            border-radius: 4px;
            outline: none;
        }
        .form-group input:focus { border-color: var(--crimson); }
        .error-msg { color: #ff4d4d; font-size: 0.8rem; margin-top: 1rem; display: none; }
    </style>
</head>
<body>

    <nav>
        <div class="logo"><a href="/" style="text-decoration:none; color:inherit;">CAMPUS<span>PULSE</span></a></div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <h2 style="margin-bottom: 0.5rem;">Welcome Back</h2>
            <p style="color: #888; font-size: 0.9rem; margin-bottom: 2rem;">Log in to manage your fest registrations.</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="student@college.edu" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
                <div id="error" class="error-msg"></div>
            </form>

            <p style="margin-top: 1.5rem; font-size: 0.8rem; text-align: center; color: #888;">
                Don't have an account? <a href="/signup" style="color: var(--sand); text-decoration: none;">Sign Up</a>
            </p>
        </div>
    </div>

    <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorDiv = document.getElementById('error');
        errorDiv.style.display = 'none'; // Clear previous errors

        // 1. Get values
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        // 2. Prepare Data as JSON (Required for your specific backend)
        const loginData = {
            email: email,
            password: password
        };

        try {
            // 3. Send Request to the CORRECT URL
            // Your auth_routes.py defines it as @router.post("/login"), so we use "/auth/login"
            const response = await fetch('/auth/login', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify(loginData)
            });

            const result = await response.json();

            if (response.ok) {
                // Success! 
                // Store the token (your backend returns { "access_token": ... })
                localStorage.setItem('token', result.access_token);
                
                // Redirect based on admin status
                if (result.is_admin) {
                    window.location.href = '/admin-dashboard'; // Update if your route is different
                } else {
                    window.location.href = '/dashboard';       // Update if your route is different
                }
            } else {
                // Show server error (e.g., "Invalid Credentials")
                errorDiv.textContent = result.detail || "Login failed.";
                errorDiv.style.display = 'block';
            }
        } catch (err) {
            console.error(err);
            errorDiv.textContent = "Connection error. Check console.";
            errorDiv.style.display = 'block';
        }
    });
</script>
</body>
</html>
